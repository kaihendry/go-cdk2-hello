name: Deploy Go via TypeScript CDK

on:
  schedule:
    - cron: 0 0 * * *
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make test
      - name: Check Go formatting
        run: test -z "$(gofmt -l src)"
      - name: Check Go vulnerabilities
        working-directory: src
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: npm run synth -- --quiet

  staging:
    if: github.event_name != 'pull_request'
    needs: checks
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      domain: stghello.dabase.com
    secrets: inherit

  production:
    needs: staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      domain: hello.dabase.com
    secrets: inherit
