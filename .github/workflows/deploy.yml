name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      domain:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ inputs.domain }}
    env:
      DOMAIN: ${{ inputs.domain }}
      AWSCERT: arn:aws:acm:eu-west-2:407461997746:certificate/9083a66b-72b6-448d-9bce-6ee2e2e52e36
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        if: inputs.environment == 'staging'
        with:
          go-version: stable
          cache-dependency-path: src/go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
          run_install: true
      - if: inputs.environment == 'staging'
        run: make -C src VERSION="${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.environment == 'staging'
        with:
          name: lambda
          path: src/function.zip
          if-no-files-found: error
          overwrite: true
      - uses: actions/download-artifact@v8.0.2
        if: inputs.environment == 'production'
        with:
          name: lambda
          path: src
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::407461997746:role/github-actions-Role-56IHHM969DKJ
          aws-region: eu-west-2
      - run: pnpm cdk deploy --require-approval never --outputs-file outputs.json
      - name: Check DNS target
        id: dns
        run: |
          echo "target=$(jq -er '.[].APIGatewayDomain' outputs.json)" >> "$GITHUB_OUTPUT"
          echo "actual=$(dig +short CNAME "$DOMAIN" | sed 's/\.$//')" >> "$GITHUB_OUTPUT"
      - name: Update Cloudflare DNS
        if: steps.dns.outputs.target != steps.dns.outputs.actual
        uses: everpcpc/cloudflare-dns-action@v1
        with:
          type: CNAME
          name: ${{ inputs.domain }}
          content: ${{ steps.dns.outputs.target }}
          ttl: 1
          proxied: false
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          zone: ${{ secrets.CLOUDFLARE_ZONE }}
      - name: Smoke test
        run: test "$(curl -fsS --retry 3 --max-time 30 "https://$DOMAIN")" = "CICD World ... ${GITHUB_SHA::7}"
