name: SLOC history

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6.0.0
      - uses: kaihendry/lesshero@v0.2.1
        with:
          ignore: go.sum,src/go.sum,package-lock.json,pnpm-lock.yaml
      - run: mkdir _site && mv lesshero.html _site/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
